name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Lint with flake8
      run: |
        flake8 scripts/global/lam_archivator_init.py core/stream_conveyor/hybrid_context_cluster_sync.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/global/lam_archivator_init.py core/stream_conveyor/hybrid_context_cluster_sync.py --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics
    - name: Verify Core Modules Compilation & Archivator Protocol
      run: |
        python -m py_compile scripts/global/lam_archivator_init.py core/stream_conveyor/hybrid_context_cluster_sync.py scripts/global/cluster_mesh_ssn_orchestrator.py
        pytest tests/test_lam_archivator_init_protocol.py -q
