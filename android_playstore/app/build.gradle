plugins {
    id 'com.android.application'
}

android {
    namespace 'com.architit.radriloniuma'
    compileSdk 35

    defaultConfig {
        applicationId 'com.architit.radriloniuma'
        minSdk 26
        targetSdk 35
        versionCode 202611221
        versionName '2026.11.22'
    }

    signingConfigs {
        release {
            storeFile file('/root/RADRILONIUMA/bin/radr.keystore')
            storePassword 'radriloniuma'
            keyAlias 'radr_alias'
            keyPassword 'radriloniuma'
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    flavorDimensions += 'distribution'
    productFlavors {
        playInternal {
            dimension 'distribution'
            versionNameSuffix '-play'
        }
        sovereign {
            dimension 'distribution'
            versionNameSuffix '-sovereign'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
